# uv workspace root. The three members are deliberately separable:
#   shared/   the event schema - the contract, needed by BOTH halves
#   central/  the central server, runs on the server laptop
#   edge/     the simulated bus fleet, runs on the edge laptop
# `scripts/bundle.sh <part>` produces a self-contained copy of either half.
[project]
name = "urban-intelligence-platform"
version = "0.1.0"
description = "SIH 26124 - AI-Powered Mobile Urban Intelligence Platform (prototype)"
requires-python = ">=3.11"
dependencies = [
    "uip-schema",
    "uip-central",
    "uip-edge",
]

[tool.uv.workspace]
members = ["shared", "central", "edge"]
# poc/ is a separate project with its own lockfile - it pulls torch, which
# neither deployable half should carry. See poc/pyproject.toml.
exclude = ["poc"]

[tool.uv.sources]
uip-schema = { workspace = true }
uip-central = { workspace = true }
uip-edge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
