# The event schema, and nothing else. Both halves depend on this and on no part of
# each other: the bus builds events against it, the server validates against it.
[project]
name = "uip-schema"
version = "0.1.0"
description = "Event schema shared by the edge units and the central server"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uip_schema"]
